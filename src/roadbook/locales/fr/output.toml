# French for the strips, the reference sheet, the climb pages and the map page, by their English: see i18n.py.
# \u00a0 is a no-break space: before : ; ! ? and between a number and its unit, as French prints them.

"road book" = "roadbook"

# the strips' labels: build.py, kinds.py. Each sits on its row's main line, between its emojis and the ↓ distance,
# and is cut where it runs out of room, about 8 mm: "Départ" is about as wide as "START", "DÉPART" wider
"START" = "Départ"
"FINISH" = "Arrivée"
"Cat {label}" = "Cat {label}"
# a checkpoint's km to the finish, on the sub line under "CP1", where a climb's stats go: about 20 mm, cut with a …
"{n} km to go" = "{n}\u00a0km restants"

# a shop's hours on the ride day, and whether it is open when the rider passes: opening.py, render/sheet.py
"closed" = "fermé"
"open?" = "ouvert\u00a0?"
"open 24 h" = "ouvert 24\u00a0h"
"closes {time}" = "ferme à {time}"
"opens {time}" = "ouvre à {time}"
"may close {time}" = "peut fermer à {time}"
"may open {time}" = "peut ouvrir à {time}"

# the reference sheet's title: render/sheet.py ride_title()
"opening hours on {date}" = "horaires d'ouverture du {date}"
"start {when} at {pace} ({margin})" = "départ {when} à {pace} ({margin})"
"{speed} km/h" = "{speed}\u00a0km/h"
"{pace}, {speed} km/h downhill" = "{pace}, {speed}\u00a0km/h en descente"
"{pace} + {minutes} min/100 m climbed" = "{pace} + {minutes}\u00a0min/100\u00a0m de D+"
"±{pct} %, ≥{minutes} min" = "±{pct}\u00a0%, ≥{minutes}\u00a0min"
"breaks: {breaks}" = "pauses\u00a0: {breaks}"
"km {km} ({minutes} min)" = "km {km} ({minutes}\u00a0min)"

# a climb, on the reference sheet and its climb page
"{length} km at {grade} %" = "{length}\u00a0km à {grade}\u00a0%"
"max {grade} %" = "max {grade}\u00a0%"
"Climb at km {km}" = "Montée au km {km}"

# the key to the climb colours: render/sheet.py grade_key()
"climbs" = "montées"
"under {grade} %" = "moins de {grade}\u00a0%"
"{low}–{high} %" = "{low}–{high}\u00a0%"
"{grade} % and more" = "{grade}\u00a0% et plus"
"Climbs by grade:" = "Montées par pente\u00a0:"
"Grade of each slab:" = "Pente de chaque segment\u00a0:"

# what the reference sheet owes OpenStreetMap: render/sheet.py credit(), "Opening hours, town names and climb names"
"opening hours" = "horaires d'ouverture"
"town names" = "noms des villes"
"climb names" = "noms des montées"
"place names" = "noms de lieux"
"{items} and {last}" = "{items} et {last}"
"© OpenStreetMap contributors (ODbL)." = "© les contributeurs d'OpenStreetMap (ODbL)."
# without its full stop, which the template adds: the booklet has the sentence whole, in booklet.toml
"Hours change: check the ones you rely on" = "Les horaires changent\u00a0: vérifiez ceux sur lesquels vous comptez"
"Made with" = "Fait avec"

# the pages' titles
"map" = "carte"
"hours unknown" = "horaires inconnus"
