# French for the settings as the GUI shows them (settings.py's labels, help, choices, and the POI categories' names).

# the settings' labels and help, in settings.SETTINGS's order
"Layout" = "Mise en page"
"strip: vertical, top tube. line: one horizontal ribbon of tokens." = "bande : verticale, sur le tube horizontal. ruban : un seul ruban horizontal de repères."
"Paper size" = "Format du papier"
"Paper size, e.g. A4, A5, Letter." = "Format du papier, par ex. A4, A5, Letter."
"Language of the road book" = "Langue du roadbook"
"The road book's and booklet's language: en (English) or fr (French)." = "Langue du roadbook et du livret : en (anglais) ou fr (français)."
"Checkpoint every N km (0 = none)" = "Point de contrôle tous les N km (0 = aucun)"
"Auto checkpoint every N km (0 = off)." = "Point de contrôle automatique tous les N km (0 = aucun)."
"Extra checkpoints, KM or KM:LABEL" = "Points de contrôle en plus, KM ou KM:NOM"
"Extra checkpoint, KM or KM:LABEL. Repeatable." = "Point de contrôle en plus, KM ou KM:NOM. Répétable."
"Name the towns at busy stops (OpenStreetMap, needs internet)" = "Nommer les villes aux arrêts bien fournis (OpenStreetMap, connexion requise)"
"Name the town at busy stops, from OpenStreetMap (default: on)." = "Nomme la ville aux arrêts bien fournis, d'après OpenStreetMap (par défaut : oui)."
"Look up shops' opening hours (OpenStreetMap, needs internet)" = "Chercher les horaires d'ouverture des commerces (OpenStreetMap, connexion requise)"
"Look up shops' opening hours on OpenStreetMap for the details sheet (needs internet)." = "Cherche les horaires d'ouverture des commerces sur OpenStreetMap pour la fiche récapitulative (connexion requise)."
"Ride date, YYYY-MM-DD, for arrival times (empty: none)" = "Date, AAAA-MM-JJ, pour les heures de passage (vide : aucune)"
"Ride date, YYYY-MM-DD (empty: the whole week's hours, no arrival times)" = "Date, AAAA-MM-JJ (vide : horaires de toute la semaine, sans heures de passage)"
"Ride date, YYYY-MM-DD: with --hours, each shop's hours that day." = "Date de la sortie, AAAA-MM-JJ : avec --hours, les horaires de chaque commerce ce jour-là."
"Start time, HH:MM (empty: no arrival times)" = "Heure de départ, HH:MM (vide : pas d'heures de passage)"
'Start time, HH:MM (or "YYYY-MM-DD HH:MM"): with --speed, when you reach each stop.' = "Heure de départ, HH:MM (ou « AAAA-MM-JJ HH:MM ») : avec --speed, l'heure à laquelle vous atteignez chaque arrêt."
"Average speed on the flat, km/h, short stops included" = "Vitesse moyenne sur le plat, km/h, petits arrêts compris"
"Average speed, km/h, short stops included: with --start, arrival times." = "Vitesse moyenne, km/h, petits arrêts compris : avec --start, les heures de passage."
"Planned breaks, KM:MINUTES separated by spaces (empty: none)" = "Pauses prévues, KM:MINUTES séparés par des espaces (vide : aucune)"
"Planned break, KM:MINUTES, delaying every later stop. Repeatable." = "Pause prévue, KM:MINUTES, qui retarde tous les arrêts suivants. Répétable."
"POI categories to show" = "Catégories de POI à afficher"
"Comma-separated POI categories to keep, e.g. water,bakery,lodging." = "Catégories de POI à garder, séparées par des virgules, par ex. water,bakery,lodging."
"Strip width, mm" = "Largeur de la bande, mm"
"Short side of a strip, mm (default: 35 strip / 16 line)." = "Petit côté d'une bande, mm (par défaut : 35 en bande / 16 en ruban)."
"Strip length, mm" = "Longueur de la bande, mm"
"Long side of a strip, mm." = "Grand côté d'une bande, mm."
"Merge POIs closer than, m" = "Regrouper les POI à moins de, m"
"Merge POIs closer than this many metres into one stop." = "Regroupe en un seul arrêt les POI à moins de ce nombre de mètres."
"Longest stop, m" = "Arrêt le plus long, m"
"Longest a stop may stretch, metres; longer runs split (default 3 x gap)." = "Longueur maximale d'un arrêt, en mètres ; au-delà, il est coupé (par défaut 3 x gap)."
"Smallest climb, m of gain" = "Plus petite montée, m de D+"
"Smallest gain, metres, for an ascent to count as a climb (default 80)." = "Dénivelé positif minimal, en mètres, pour qu'une ascension compte comme montée (par défaut 80)."
"Lines of emojis a busy stop may fill" = "Lignes d'emojis d'un arrêt bien fourni"
"Lines a crowded stop's emojis may fill on a strip (default 2; 1 = one line, with a +)." = "Lignes que les emojis d'un arrêt bien fourni peuvent occuper sur une bande (par défaut 2 ; 1 = une ligne, avec un +)."
"Reference sheet with POI names" = "Fiche récapitulative avec le nom des POI"
"Append a POI names reference sheet, without a booklet." = "Ajoute une fiche récapitulative avec le nom des POI, sans livret."
"Arrival times may be off by, % of the time ridden" = "Marge des heures de passage, % du temps roulé"
"How far off arrival times may be, % of the time ridden (default 15; at least 20 min)." = "Écart possible des heures de passage, en % du temps roulé (par défaut 15 ; au moins 20 min)."
"Arrival times: minutes added per 100 m climbed" = "Heures de passage : minutes ajoutées par 100 m de D+"
"Minutes added to arrival times per 100 m climbed (default 5)." = "Minutes ajoutées aux heures de passage par 100 m de dénivelé positif (par défaut 5)."
"A summit row at every climb's top" = "Une ligne sommet en haut de chaque montée"
"A summit row at every climb's top, not only where a stop is (default: off)." = "Une ligne sommet en haut de chaque montée, pas seulement là où il y a un arrêt (par défaut : non)."
"Name the cols and peaks (OpenStreetMap, needs internet)" = "Nommer les cols et les sommets (OpenStreetMap, connexion requise)"
"Name the col, pass or peak at each climb's top, from OpenStreetMap (default: on)." = "Nomme le col ou le sommet en haut de chaque montée, d'après OpenStreetMap (par défaut : oui)."
"Climb pages, a profile per climb" = "Pages des montées, un profil par montée"
"Append climb pages: each climb's profile in slabs of 1 km, or shorter on a short climb, with their grades and the places on the way (default: off)." = "Ajoute les pages des montées : le profil de chaque montée par tranches de 1 km, ou moins sur une montée courte, avec leurs pentes et les lieux traversés (par défaut : non)."
"Climb pages for the climbs of category, or harder" = "Pages pour les montées de catégorie, ou plus dures"
"The easiest category that gets a climb page: HC, 1, 2, 3 or 4 (default 3)." = "La catégorie la plus facile qui a sa page : HC, 1, 2, 3 ou 4 (par défaut 3)."
"A map of the route (needs internet the first time)" = "Une carte du parcours (connexion requise la première fois)"
"Add a page with a map of the whole route, its stops, towns and climbs, from OpenStreetMap-based tiles (default: on; needs internet the first time)." = "Ajoute une page avec une carte de tout le parcours, ses arrêts, villes et montées, à partir de tuiles issues d'OpenStreetMap (par défaut : oui ; connexion requise la première fois)."
"Map style" = "Style de carte"
"The map's look: osm (plain), cyclosm (for cycling), topo (relief and contours) or satellite (default osm)." = "L'aspect de la carte : osm (simple), cyclosm (pour le vélo), topo (relief et courbes de niveau) ou satellite (par défaut osm)."
"Contour lines on the map" = "Courbes de niveau sur la carte"
"Draw contour lines on the map, with their heights, from Mapzen's Terrain Tiles (default: on; the topo style has its own)." = "Trace les courbes de niveau sur la carte, avec leur altitude, d'après les Terrain Tiles de Mapzen (par défaut : oui ; le style topo a les siennes)."
"A booklet to take on the ride (stops, climbs and map)" = "Un livret à emporter (arrêts, montées et carte)"
"Also make a booklet of the stops, climbs and map, to print, fold and take on the ride: A5 (default), A6 (pocket size) or off (the reference sheet, map and climb pages then stay in the road book)." = "Crée aussi un livret des arrêts, des montées et de la carte, à imprimer, plier et emporter : A5 (par défaut), A6 (format poche) ou aucun (la fiche récapitulative, la carte et les pages des montées restent alors dans le roadbook)."
"Warn of stretches without water from, hours of riding (0 = never)" = "Alerte si pas d'eau pendant, heures de route (0 = jamais)"
"With a speed, the booklet warns of a stretch taking this long to ride, hours, climbing included, with nowhere to get water (default 3; 0 = never)." = "Avec une vitesse, le livret signale un tronçon de cette durée, en heures, montées comprises, sans point d'eau (par défaut 3 ; 0 = jamais)."
"Warn of stretches without water from, km (0 = never)" = "Alerte si pas d'eau sur, km (0 = jamais)"
"Without a speed, the booklet warns of a stretch this long, km, with nowhere to get water (default 50; 0 = never)." = "Sans vitesse, le livret signale un tronçon de cette longueur, en km, sans point d'eau (par défaut 50 ; 0 = jamais)."
"Warn of stretches without food from, hours of riding (0 = never)" = "Alerte si rien à manger pendant, heures de route (0 = jamais)"
"With a speed, the booklet warns of a stretch taking this long to ride, hours, climbing included, with nothing to eat (default 4; 0 = never)." = "Avec une vitesse, le livret signale un tronçon de cette durée, en heures, montées comprises, sans rien à manger (par défaut 4 ; 0 = jamais)."
"Warn of stretches without food from, km (0 = never)" = "Alerte si rien à manger sur, km (0 = jamais)"
"Without a speed, the booklet warns of a stretch this long, km, with nothing to eat (default 70; 0 = never)." = "Sans vitesse, le livret signale un tronçon de cette longueur, en km, sans rien à manger (par défaut 70 ; 0 = jamais)."
"Output file" = "Fichier de sortie"
"Output .html (default: next to the GPX)." = "Fichier .html créé (par défaut : à côté du GPX)."
"Also export a PDF?" = "Exporter aussi un PDF ?"
"Also export a PDF via headless Edge/Chrome." = "Exporte aussi un PDF, avec Edge ou Chrome sans fenêtre."
"Look everything up again online" = "Tout rechercher à nouveau en ligne"
"Look up opening hours, towns, climb names, the places on climbs and the map's tiles again, instead of using the cached ones." = "Recherche à nouveau les horaires d'ouverture, les villes, les noms des montées, les lieux sur les montées et les tuiles de la carte, au lieu de ceux en cache."

# what a check says of a field's answer
"a speed above 0, for the arrival times" = "une vitesse au-dessus de 0, pour les heures de passage"

# the choices that are words; the others are names, kept as they are (A4, HC, osm…)
"strip" = "bande"
"line" = "ruban"
"off" = "aucun"

