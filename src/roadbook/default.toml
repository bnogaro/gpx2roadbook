# Default settings. Override any key with `roadbook --config my.toml` (deep-merged).

[elevation]
step_m = 25          # resampling grid
smooth_m = 200       # moving-average window applied after a 5-point median
swing_m = 3          # ignore up/down swings smaller than this when summing gain/loss

[climbs]
min_gain_m = 80      # an ascent gaining less than this is a bump, not a climb
min_length_m = 500
min_grade_pct = 2.0
merge_gap_m = 800    # merge two ascents whose break (top to next foot) is at most this long...
merge_dip_m = 10     # ...and descends at most this many metres...
merge_dip_ratio = 0.25  # ...or at most this fraction of the smaller ascent's gain
snap_m = 300         # a stop this close to a climb's foot or summit is shown on that climb's row / as its summit
# category = first threshold reached, on score = length_m * avg_grade_pct (Tour de France style)
categories = [["HC", 80000], ["1", 64000], ["2", 32000], ["3", 16000], ["4", 8000]]

[pois]
max_offset_m = 300   # ignore POIs further than this from the route
enabled = ["water", "toilets", "bakery", "cafe", "food", "fastfood", "grocery", "fuel", "vending", "icecream"]

[stops]
gap_m = 500          # POIs closer than this are merged into one stop...
max_span_m = 0       # ...as long as the stop does not stretch beyond this; 0 = 3 x gap_m

[hours]
enabled = false      # look up opening hours on OpenStreetMap (needs internet; cached afterwards)
categories = ["bakery", "grocery", "fuel", "cafe", "fastfood", "icecream"]
match_m = 80         # an OSM place counts as the POI when this close to it and named alike
max_age_days = 30    # look up again once a cached answer is this old

[hours.kinds]        # the OSM main tags (amenity, else shop, else craft) a place may have to be the POI of a category
bakery = ["shop=bakery", "shop=pastry", "craft=bakery", "craft=confectionery"]
grocery = [
  "shop=supermarket", "shop=convenience", "shop=general", "shop=greengrocer", "shop=deli",
  "shop=farm", "shop=organic", "shop=health_food", "shop=food",
]
fuel = ["amenity=fuel"]
cafe = ["amenity=cafe", "amenity=bar", "amenity=pub", "amenity=restaurant"]
food = ["amenity=restaurant", "amenity=fast_food", "amenity=cafe", "amenity=pub"]
fastfood = ["amenity=fast_food", "amenity=restaurant", "amenity=cafe"]
icecream = ["amenity=ice_cream", "shop=ice_cream", "amenity=cafe"]
# a category with no list here matches places of any kind

[towns]
enabled = false      # name the town at busy stops, from OpenStreetMap (needs internet; cached afterwards)
min_pois = 8         # a stop is busy, likely a town centre, from this many POIs (of the categories shown)...
shop_min_pois = 5    # ...or from this many, when one of them is a village shop:
shops = ["bakery", "grocery"]
max_age_days = 365   # look up again once a cached answer is this old

[climb_names]
enabled = true       # name the col, pass or peak at each climb's top, from OpenStreetMap (needs internet; cached)
pass_m = 300         # a named mountain pass or saddle this close to the summit names the climb...
peak_m = 200         # ...else a named peak this close (the road crosses a pass, but only skirts a peak)
max_age_days = 365   # look up again once a cached answer is this old

[ride]
date = ""            # "YYYY-MM-DD": with hours, each shop's hours on that day only ("" = its whole week)
start = ""           # "HH:MM", with date and speed_kmh: estimate when each stop is reached...
speed_kmh = 0        # ...at this average speed, short stops included (0 = no estimate)
margin_pct = 15      # the estimate may be off by this share of the time ridden...
margin_min = 20      # ...and by at least this many minutes

[checkpoints]
every_km = 0        # 0 disables automatic checkpoints
extra = []           # [[km, "label"], ...]

[render]
layout = "strip"     # strip | line
width_mm = 0         # short side; 0 = layout default (strip 35, line 16)
length_mm = 200      # long side
page = "A4"
details = true       # append a POI-names reference sheet
stop_range_m = 1000  # a stop stretching at least this far shows where it ends ("→125.0")
leg_elevation = false  # show ↗️/↘️ metres on each leg between rows (the gutter already shows the terrain)
emoji_lines = 2      # strip layout: lines a crowded stop's emojis may fill (1 = cut to its row, with a "+")
max_emojis = 0       # 0 = derived from width
gutter_mm = 4        # strip layout: elevation profile down the right edge, aligned to the rows; 0 = off

# --- categories: order = display priority. `match` is tested (accent/case-insensitive)
# --- against the POI <type>, then its <name>. First category that matches wins.
[categories.water]
emoji = "🚰"
match = ["eau potable", "drinking water", "cimetiere", "fontaine", "fountain"]

[categories.toilets]
emoji = "🚻"
match = ["toilet", "wc"]

[categories.bakery]
emoji = "🥖"
match = ["boulangerie", "bakery", "patisserie"]

[categories.cafe]
emoji = "☕"
match = ["cafe", "bar", "brasserie", "salon de the"]

[categories.food]
emoji = "🍽️"
match = ["restaurant"]

[categories.fastfood]
emoji = "🍔"
match = ["restauration rapide", "fast food", "snack", "pizza", "kebab"]

[categories.grocery]
emoji = "🛒"
match = ["epicerie", "supermarche", "supermarket", "convenience", "magasin", "superette", "alimentation"]

[categories.fuel]
emoji = "⛽"
match = ["station-service", "station service", "fuel", "gas station"]

[categories.vending]
emoji = "🥤"
match = ["distributeur", "vending"]

[categories.icecream]
emoji = "🍦"
match = ["glacier", "ice cream"]

[categories.lodging]
emoji = "🛏️"
match = ["hotel", "chambre d'hotes", "auberge", "hostel", "guest house", "camping", "gite"]
