name: Dependabot auto-merge

# Dependabot's grouped updates merge themselves once main's required check passes. The groups in
# .github/dependabot.yml say which updates those are: patches, the tools' and the actions' minors, security fixes.
# An update outside a group (a major, a dependency's minor) waits for a person.
on:
  pull_request:

permissions: {}

jobs:
  auto-merge:
    # the pull request's author, not github.actor: that one is whoever pushed or re-ran last
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # merges the pull request
      pull-requests: write  # turns its auto-merge on
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98  # v3.1.0
      - name: Merge once the required check passes
        if: steps.metadata.outputs.dependency-group != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --merge "$PR_URL"
