name: Release

# Continuous delivery: when a version bump lands on main (a "bump: …" PR from `make release`), publish it.
# A version that already has its v-tag is skipped, so ordinary merges to main do nothing here.
on:
  push:
    branches: [main]
    paths: [pyproject.toml]
  workflow_dispatch:  # retry a failed release of the current version

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # tags, to tell a new version from a released one
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - id: version
        run: |
          version="$(uv version --short)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - run: uv build
      - name: Smoke test the wheel in a clean environment
        # renders a sample end to end, so a missing template or default.toml in the wheel fails here, not for users;
        # offline (--no-towns): it tests the wheel, not OpenStreetMap, and the flat sample has no climbs to name
        run: |
          uvx --isolated --from ./dist/*.whl roadbook --help
          uvx --isolated --from ./dist/*.whl roadbook samples/paris_le_mans.gpx --no-towns -o "$RUNNER_TEMP/smoke.html"
          test -s "$RUNNER_TEMP/smoke.html"
      - name: Smoke test the GUI extra
        # --help returns before NiceGUI is imported, so import the window's module too: a missing page or component
        # in the wheel, or an extra that no longer resolves, fails here
        run: |
          whl=$(echo dist/*.whl)
          uvx --isolated --from "gpx2roadbook[gui] @ ./$whl" roadbook-gui --help
          uv run --isolated --no-project --with "gpx2roadbook[gui] @ ./$whl" python -c "import roadbook.gui.app"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/gpx2roadbook/${{ needs.check.outputs.version }}/
    permissions:
      id-token: write  # PyPI trusted publishing (OIDC): no API token is stored anywhere
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        # attestations (PEP 740) are generated and uploaded by default

  github-release:
    needs: [check, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # creates the v-tag and the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # this version's CHANGELOG section, if commitizen wrote one; GitHub's generated notes otherwise
          awk -v v="$VERSION" '/^## /{p = index($0, v) > 0; next} p' CHANGELOG.md 2>/dev/null > notes.md || true
          if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --title "v$VERSION" "${notes[@]}"
