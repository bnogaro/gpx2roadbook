name: Release

# Continuous delivery: when a version bump lands on main (a "bump: …" PR from `make release`), publish it.
# A version that already has its v-tag is skipped, so ordinary merges to main do nothing here.
on:
  push:
    branches: [main]
    paths: [pyproject.toml]
  # retry a failed release of the current version, from its build. Once PyPI has taken the upload, which it takes
  # once, re-run the failed jobs of that run instead
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # tags, to tell a new version from a released one
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - id: version
        run: |
          version="$(uv version --short)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv build
      - name: Smoke test the wheel in a clean environment
        # renders a sample end to end, so a missing template or default.toml in the wheel fails here, not for users;
        # offline (--no-towns, --no-map): it tests the wheel, not OpenStreetMap nor the tile servers, and the flat
        # sample has no climbs to name
        run: |
          uvx --isolated --from ./dist/*.whl roadbook --help
          uvx --isolated --from ./dist/*.whl roadbook samples/paris_le_mans.gpx --no-towns --no-map -o "$RUNNER_TEMP/smoke.html"
          test -s "$RUNNER_TEMP/smoke.html"
          test -s "$RUNNER_TEMP/smoke.booklet.html"
      - name: Smoke test the GUI extra
        # --help returns before NiceGUI is imported, so import the window's module too: a missing page or component
        # in the wheel, or an extra that no longer resolves, fails here
        run: |
          whl=$(echo dist/*.whl)
          uvx --isolated --from "gpx2roadbook[gui] @ ./$whl" roadbook-gui --help
          uv run --isolated --no-project --with "gpx2roadbook[gui] @ ./$whl" python -c "import roadbook.gui.app"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  app:  # the downloadable app; before anything is published, so a broken one stops the release
    needs: check
    if: needs.check.outputs.release == 'true'
    uses: ./.github/workflows/app.yml

  publish:
    needs: [check, build, app]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/gpx2roadbook/${{ needs.check.outputs.version }}/
    permissions:
      id-token: write  # PyPI trusted publishing (OIDC): no API token is stored anywhere
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        # attestations (PEP 740) are generated and uploaded by default

  github-release:
    needs: [check, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # creates the v-tag and the release
      id-token: write  # signs the attestation
      attestations: write  # and stores it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: app-*  # the app's zips, attached beside the wheel
          path: dist/
          merge-multiple: true
      # says which commit and run of this repository made each file: `gh attestation verify <file> --repo
      # bnogaro/gpx2roadbook`. The app's zips have no other proof; the wheel has PyPI's too
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/*
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # this version's CHANGELOG section, if commitizen wrote one; GitHub's generated notes otherwise
          awk -v v="$VERSION" '/^## /{p = index($0, v) > 0; next} p' CHANGELOG.md 2>/dev/null > notes.md || true
          if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --title "v$VERSION" "${notes[@]}"
