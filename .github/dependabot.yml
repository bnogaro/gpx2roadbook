version: 2
# An update in a group merges itself once CI passes (.github/workflows/dependabot-auto-merge.yml); any other waits
# for a person. So a group's update-types say what is taken unread.
updates:
  # Python dependencies (pyproject.toml + uv.lock)
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # don't take releases published less than 7 days ago (supply-chain protection)
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-dependencies:
        dependency-type: production
        update-types: [patch]
      # security fixes come ungrouped unless a group is theirs
      security-fixes:
        applies-to: security-updates
        patterns: ["*"]
        update-types: [minor, patch]

  # GitHub Actions (keeps the SHA pins and their version comments current)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  # The hooks of .pre-commit-config.yaml (their rev), which the commits and CI's lint job run
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      hooks:
        patterns: ["*"]
        update-types: [minor, patch]
