[project]
name = "roadbook"
version = "0.1.0"
description = "Turn a GPX file with POIs into a compact, printable road book for a bike top tube."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gpxpy>=1.6",
    "numpy>=1.26",
    "jinja2>=3.1",
    "typer>=0.12",
]

[project.scripts]
roadbook = "roadbook.cli:app"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    "prek>=0.5.3",
]
lint = [
    "ruff>=0.16.10",
    "ty>=0.0.84",
]
test = [
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",       # docstrings: not enforced; key functions carry short ones already
    "COM812",  # trailing comma: conflicts with the formatter
    "ISC001",  # implicit string concat: conflicts with the formatter
    "CPY001",  # copyright header: the project does not use per-file notices
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",     # assert is how pytest tests are written
    "PLR2004",  # literal expected values are clearer than named constants in tests
    "PLC2701",  # tests exercise private helpers directly
    "INP001",   # tests/ is a pytest rootdir, not a package
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
