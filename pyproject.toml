[project]
name = "roadbook"
version = "0.1.0"
description = "Turn a GPX file with POIs into a compact, printable road book for a bike top tube."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gpxpy>=1.6",
    "numpy>=1.26",
    "jinja2>=3.1",
    "typer>=0.12",
]

[project.scripts]
roadbook = "roadbook.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roadbook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
