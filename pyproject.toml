[project]
name = "roadbook"
version = "0.1.0"
description = "Turn a GPX file with POIs into a compact, printable road book for a bike top tube."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gpxpy>=1.6",
    "numpy>=1.26",
    "jinja2>=3.1",
    "typer>=0.12",
]

[project.scripts]
roadbook = "roadbook.cli:app"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    "prek>=0.5.3",
]
lint = [
    "ruff>=0.16.10",
    "ty>=0.0.84",
]
test = [
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
