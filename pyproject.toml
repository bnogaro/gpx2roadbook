[project]
name = "gpx2roadbook"
version = "0.4.0"
description = "Turn a GPX file with POIs into a compact, printable road book for a bike top tube."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Bastien Nogaro" }]
keywords = ["gpx", "cycling", "roadbook", "road book", "bikepacking", "ultra-cycling", "cue sheet", "poi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Utilities",
]
dependencies = [
    "gpxpy>=1.6",
    "numpy>=1.26",
    "jinja2>=3.1",
    "typer>=0.12",
    "questionary>=2.1.1",
    "platformdirs>=4",
    "opening-hours-py>=2.1",
]

[project.urls]
Homepage = "https://github.com/bnogaro/gpx2roadbook"
Issues = "https://github.com/bnogaro/gpx2roadbook/issues"
Changelog = "https://github.com/bnogaro/gpx2roadbook/blob/main/CHANGELOG.md"

[project.scripts]
roadbook = "roadbook.cli:app"
gpx2roadbook = "roadbook.cli:app"  # same command under the package's name, so `uvx gpx2roadbook` works

[dependency-groups]
audit = [
    "pip-audit>=2.10.1",
]
dev = [
    { include-group = "audit" },
    { include-group = "lint" },
    { include-group = "test" },
    "prek>=0.5.4",
]
lint = [
    "ruff>=0.16.10",
    "ty>=0.0.84",
]
test = [
    "pytest>=8",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "roadbook"  # the distribution is gpx2roadbook (roadbook is taken on PyPI); import and command stay roadbook

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=roadbook",
    "--cov-report=term-missing",
    "--cov-fail-under=80",  # measured 80.5% (branch) when introduced; ratchet up as tests grow
]

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",       # docstrings: not enforced; key functions carry short ones already
    "COM812",  # trailing comma: conflicts with the formatter
    "ISC001",  # implicit string concat: conflicts with the formatter
    "CPY001",  # copyright header: the project does not use per-file notices
]

[tool.ruff.lint.pylint]
# the SVG and row builders take a profile/item plus a handful of geometry inputs
max-args = 6
max-positional-args = 6

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",     # assert is how pytest tests are written
    "PLR2004",  # literal expected values are clearer than named constants in tests
    "PLC2701",  # tests exercise private helpers directly
    "INP001",   # tests/ is a pytest rootdir, not a package
]
"scripts/*.py" = [
    "INP001",  # standalone maintainer scripts, run as files, not a package
    "T201",    # they report to the terminal with print
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ty.environment]
python-version = "3.11"

[tool.ty.terminal]
error-on-warning = true

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"  # bumps [project].version and uv.lock together
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = true  # breaking changes bump the minor while in 0.x
